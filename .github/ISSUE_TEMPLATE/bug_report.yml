name: "Bug report"
description: "Report a problem with Rhodan's Markers targeting, raid markers, settings, or client compatibility."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please identify the addon version and where you got the build. Remove personal information from screenshots, Lua errors, or SavedVariables before posting.
  - type: input
    id: addon-version
    attributes:
      label: Rhodan's Markers version
      description: "Find this in the in-game AddOns list or the downloaded file name."
      placeholder: "Example: 11.2.0.0 or 12.1.0.0"
    validations:
      required: true
  - type: dropdown
    id: build-source
    attributes:
      label: Build source
      options:
        - "CurseForge release"
        - "GitHub source"
        - "Local development or beta build"
        - "Other or not sure"
    validations:
      required: true
  - type: dropdown
    id: wow-client
    attributes:
      label: World of Warcraft client
      options:
        - "Retail"
        - "TBC Anniversary"
        - "Classic Season of Discovery"
        - "Classic Forever"
        - "Other or not sure"
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - "Tank or healer detection"
        - "Target selection button"
        - "Applying or replacing raid markers"
        - "Keybind"
        - "Settings or slash commands"
        - "Client compatibility"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: "Describe what the addon showed or did."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "Include the dungeon, party size, your role, the assigned tank/healer roles, target, and whether you were in combat when relevant."
      placeholder: |
        1. Enter ... with ... party members.
        2. Target ... or left/right-click the button.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What should Rhodan's Markers have done?"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings and permissions
      description: "Include tank/healer enabled states, chosen icons, keybind, and whether you could set raid markers manually if relevant."
  - type: textarea
    id: lua-error
    attributes:
      label: Lua error
      description: "Paste the full error and stack trace if one appeared."
      render: text
  - type: textarea
    id: context
    attributes:
      label: Screenshots and other context
      description: "Add screenshots, other addons that may affect targeting or raid markers, and whether /reload changes the result."
